# Optional local override. Never add this file to RepoRun's loaded Compose files.
services:
  web:
    cpus: ${WEB_CPUS:-0.50}
    mem_limit: ${WEB_MEMORY:-512m}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    environment:
      SESSION_SECURE: "false"
  db:
    cpus: ${DB_CPUS:-0.50}
    mem_limit: ${DB_MEMORY:-512m}
